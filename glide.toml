[settings]
outer_gap = 10
inner_gap = 10
default_disable = false

[keys]
"Ctrl + ArrowLeft" = { move_focus = "left" }
"Ctrl + ArrowRight" = { move_focus = "right" }
"Ctrl + Shift + ArrowLeft" = { move_node = "left" }
"Ctrl + Shift + ArrowRight" = { move_node = "right" }
"Ctrl + F" = "toggle_fullscreen"
